
name: Build My Dream Life APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          test -n "$ZIP_FILE" || exit 1
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Android project
        id: locate
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          test -n "$PROJECT_DIR" || exit 1
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "apk_path=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Align Java and Kotlin versions
        shell: bash
        run: |
          APP_DIR="${{ steps.locate.outputs.project_dir }}/app"
          for FILE in "$APP_DIR/build.gradle" "$APP_DIR/build.gradle.kts"; do
            if [ -f "$FILE" ]; then
              sed -i 's/VERSION_1_8/VERSION_17/g' "$FILE"
              sed -i 's/"1.8"/"17"/g' "$FILE"
              sed -i "s/'1.8'/'17'/g" "$FILE"
            fi
          done

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.locate.outputs.project_dir }}" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-dream-life-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
